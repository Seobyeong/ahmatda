<meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 46px; flex: 1; }
.step { padding: 34px 30px; display: flex; flex-direction: column; }
.num { width: 44px; height: 44px; border-radius: 14px; background: #eef2ff; color: #4f46e5;
  font-size: 21px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.st { font-size: 25px; font-weight: 800; margin-top: 20px; letter-spacing: -0.7px; line-height: 1.35; }
.sd { font-size: 19px; color: #64748b; margin-top: 12px; line-height: 1.6; font-weight: 500; }
.tag { margin-top: auto; font-size: 18px; font-weight: 700; color: #94a3b8; }
.step.last { background: #fff1f2; border-color: #fecdd3; }
.step.last .num { background: #fee2e2; color: #e11d48; }
.step.last .tag { color: #e11d48; }
.big { font-size: 46px; font-weight: 900; color: #e11d48; letter-spacing: -1.8px; margin-top: 22px; }
</style>
<div class="page">
  <div class="kicker">문제</div>
  <h1>왜 항상 <span class="hl">나간 뒤에</span> 생각날까</h1>
  <div class="sub">챙길 것은 매일 달라지는데, 알려주는 도구는 전부 “사용자가 먼저 앱을 열 것”을 전제로 합니다.</div>
  <div class="grid">
    <div class="card step">
      <div class="num">1</div>
      <div class="st">전날 밤에<br>미리 챙겨둔다</div>
      <div class="sd">아침에 비 예보가 생기거나 일정이 추가되면 어제의 준비는 소용이 없습니다.</div>
      <div class="tag">→ 상황이 바뀐다</div>
    </div>
    <div class="card step">
      <div class="num">2</div>
      <div class="st">할일 앱에<br>적어 둔다</div>
      <div class="sd">적는 것도 내 몫이고, 정작 문을 나설 때는 그 앱을 열지 않습니다.</div>
      <div class="tag">→ 열지 않는다</div>
    </div>
    <div class="card step last">
      <div class="num">3</div>
      <div class="st">지하철에서<br>떠오른다</div>
      <div class="big">“아, 맞다!”</div>
      <div class="tag">→ 이미 되돌아갈 수 없다</div>
    </div>
  </div>
  <div class="footer" style="margin-top:34px"><div class="band">문제는 기억력이 아니라 <span class="em">‘알려주는 시점’</span>에 있습니다.</div></div>
</div>
